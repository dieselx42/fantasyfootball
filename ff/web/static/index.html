<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Assistant</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">Fantasy&nbsp;Assistant</div>
  <nav id="nav" class="tabs" hidden>
    <button data-view="draft" class="tab">Draft</button>
    <button data-view="week" class="tab">Week</button>
    <button data-view="results" class="tab">Results</button>
    <button data-view="trades" class="tab">Trades</button>
    <button data-view="players" class="tab">Players</button>
    <button data-view="settings" class="tab">League</button>
  </nav>
  <div class="spacer"></div>
  <div id="draftClock" class="draft-countdown" hidden></div>
  <select id="leaguePicker" class="league-picker" hidden></select>
</header>

<main id="main"></main>

<div id="toast" class="toast" hidden></div>

<!-- ===================== SETUP WIZARD ===================== -->
<template id="tpl-setup">
  <section class="wizard">
    <h1>Set up your league</h1>
    <p class="lede">Everything here is saved to a plain JSON file you can edit,
       copy, or hand to someone in another league.</p>

    <ol class="steps">
      <li class="step" data-step="1">
        <h2><span class="num">1</span> Where does your league live?</h2>
        <div id="platformList" class="platform-grid"></div>
        <div id="platformFields" class="fields"></div>
        <div id="yahooAuth" class="yahoo-auth" hidden>
          <p class="hint">Yahoo needs a free developer app. Create one at
            <a href="https://developer.yahoo.com/apps/" target="_blank" rel="noreferrer">developer.yahoo.com/apps</a>
            with redirect URI <code>oob</code> and Fantasy Sports read access.</p>
          <button id="btnAuthUrl" class="btn ghost" type="button">Get authorization link</button>
          <div id="authUrlBox" hidden>
            <a id="authUrl" target="_blank" rel="noreferrer" class="authlink"></a>
            <label>Paste the code Yahoo shows you
              <input id="yahooCode" type="text" placeholder="Authorization code">
            </label>
            <button id="btnExchange" class="btn" type="button">Connect</button>
          </div>
        </div>
      </li>

      <li class="step" data-step="2">
        <h2><span class="num">2</span> League basics</h2>
        <div class="fields">
          <label>League name <input id="fName" type="text" placeholder="Sunday Sickos"></label>
          <label>Number of teams <input id="fTeams" type="number" min="2" max="32" value="12"></label>
          <label>Scoring
            <select id="fPpr">
              <option value="0.5">Half PPR (0.5 per reception)</option>
              <option value="1">Full PPR (1 per reception)</option>
              <option value="0">Standard (no PPR)</option>
            </select>
          </label>
          <label>Draft rounds <input id="fRounds" type="number" min="1" max="40" value="15"></label>
        </div>
      </li>

      <li class="step" data-step="3">
        <h2><span class="num">3</span> Teams and managers</h2>
        <p class="hint">One row per team. You can pull these from your platform later.</p>
        <div id="teamRows" class="team-rows"></div>
        <button id="btnAddTeam" class="btn ghost" type="button">+ Add team</button>
      </li>
    </ol>

    <div id="setupProblems" class="problems" hidden></div>
    <button id="btnCreate" class="btn primary big" type="button">Create league</button>
  </section>
</template>

<!-- ===================== DRAFT ===================== -->
<template id="tpl-draft">
  <section class="draft">
    <div class="draft-head">
      <div id="clock" class="clock"></div>
      <div class="draft-actions">
        <select id="draftTeam" class="sel"></select>
        <button id="btnUndo" class="btn ghost" type="button">Undo</button>
        <button id="btnReset" class="btn danger ghost" type="button">Reset</button>
      </div>
    </div>

    <div id="noProjections" class="empty" hidden>
      <h3>No projections loaded</h3>
      <p>The board needs player projections before it can recommend anything.
         Import a CSV under <b>League &rsaquo; Projections</b>.</p>
    </div>

    <div class="draft-grid">
      <div class="panel">
        <h3>Recommended for <span id="recTeam"></span></h3>
        <div id="recs" class="recs"></div>
      </div>

      <div class="panel">
        <h3>Available <input id="search" class="search" type="search" placeholder="Search players"></h3>
        <div class="poschips" id="posChips"></div>
        <div id="avail" class="avail"></div>
      </div>

      <div class="panel side">
        <h3>Positional cliffs</h3>
        <div id="scarcity" class="scarcity"></div>
        <h3>Your roster</h3>
        <div id="myRoster" class="roster"></div>
        <h3>Recent picks</h3>
        <div id="recent" class="recent"></div>
      </div>
    </div>
  </section>
</template>

<!-- ===================== THE WEEK ===================== -->
<template id="tpl-week">
  <section class="stack">
    <div class="row">
      <h1>Week <span id="wkNum"></span></h1>
      <select id="wkPicker" class="sel"></select>
      <select id="wkTeam" class="sel"></select>
    </div>
    <div id="wkBanner" class="banner" hidden></div>
    <div id="wkMatchup" class="matchup"></div>

    <div class="week-grid">
      <div class="panel">
        <h3>Starting lineup <span id="wkTotal" class="pill"></span></h3>
        <p class="hint">Set a player's status and the lineup re-solves — an
          <b>Out</b> player scores zero, so the optimiser benches him for you.</p>
        <div id="wkLineup" class="lineup"></div>
        <h3>Bench</h3>
        <div id="wkBench" class="roster"></div>
      </div>

      <div class="panel">
        <h3>Waiver wire <span id="wkFaab" class="pill"></span></h3>
        <p class="hint">Ranked by what each player adds to your <b>starting
          lineup</b> — this week and, separately, for the rest of the season.
          A great player who would never start is worth nothing to you.</p>
        <div id="wkLimits" class="problems" hidden></div>
        <div id="wkWaivers" class="recs"></div>
        <h3>Cheapest players to drop</h3>
        <div id="wkDrops" class="roster"></div>
      </div>
    </div>
  </section>
</template>

<!-- ===================== RESULTS ===================== -->
<template id="tpl-results">
  <section class="stack">
    <div class="row">
      <h1>Results</h1>
      <select id="rsWeek" class="sel"></select>
    </div>

    <div class="panel">
      <h3>Scoreboard <span id="rsState" class="pill"></span></h3>
      <div id="rsBoard" class="scoreboard"></div>
      <button id="btnScores" class="btn ghost" type="button">Enter final scores</button>
      <div id="rsScoreForm" class="score-form" hidden></div>
    </div>

    <div class="panel">
      <h3>Standings</h3>
      <p class="hint" id="rsTiebreak"></p>
      <div id="rsStandings" class="standings"></div>
    </div>

    <div class="panel">
      <h3>League activity</h3>
      <p class="hint">Every add, drop and trade in the league. Rosters are
        derived by replaying this log over the draft, so deleting a row undoes
        the move.</p>
      <div id="rsChased" class="chased"></div>
      <div id="rsFeed" class="feed"></div>
      <details class="mover">
        <summary>Record a move</summary>
        <div class="fields">
          <label>Team <select id="mvTeam" class="sel"></select></label>
          <label>Type
            <select id="mvType" class="sel">
              <option value="add_drop">Add / drop</option>
              <option value="add">Add</option>
              <option value="drop">Drop</option>
              <option value="waiver">Waiver claim</option>
              <option value="trade">Trade</option>
            </select>
          </label>
          <label id="mvPartnerWrap" hidden>With
            <select id="mvPartner" class="sel"></select>
          </label>
          <label>Adds (player search) <input id="mvAdds" type="text" placeholder="comma separated"></label>
          <label>Drops <input id="mvDrops" type="text" placeholder="comma separated"></label>
          <label>FAAB <input id="mvFaab" type="number" min="0" step="1"></label>
        </div>
        <div id="mvProblems" class="problems" hidden></div>
        <button id="btnMove" class="btn primary" type="button">Record</button>
      </details>
    </div>
  </section>
</template>

<template id="tpl-trades">
  <section class="stack">
    <h1>Trades</h1>
    <p class="lede">Suggestions respect your league's configured trade rules —
      deadline, package size, and how lopsided a deal can be before it gets vetoed.</p>
    <div class="row">
      <select id="tradeTeam" class="sel"></select>
      <button id="btnSuggest" class="btn primary" type="button">Suggest trades</button>
    </div>
    <div id="tradeList" class="trades"></div>
  </section>
</template>

<template id="tpl-players">
  <section class="stack">
    <h1>Player values</h1>
    <p class="lede">Scored with <b>your</b> league's rules, then converted to value
      over replacement so positions are comparable.</p>
    <div class="row">
      <input id="pSearch" class="search" type="search" placeholder="Search">
      <div class="poschips" id="pChips"></div>
    </div>
    <div id="playerTable"></div>
  </section>
</template>

<template id="tpl-settings">
  <section class="stack">
    <h1>League settings</h1>

    <div class="panel">
      <h3>League info</h3>
      <div class="fields">
        <label>League name <input id="sName" type="text"></label>
        <label>Season <input id="sSeason" type="number" min="2000" max="2100"></label>
        <label>Platform
          <select id="sPlatform"></select>
        </label>
        <label>Platform league ID
          <input id="sLeagueKey" type="text" placeholder="from your league URL">
        </label>
      </div>
    </div>

    <div class="panel">
      <h3>Platform connection <span id="connState" class="pill"></span></h3>
      <p class="hint">Credentials are stored in the secret store, never in your
        league file — league files are meant to be committed and shared.</p>
      <div id="connFields" class="fields"></div>
      <div id="connAuth" class="yahoo-auth" hidden>
        <p class="hint">Approve on Yahoo's own site. Your password never comes
          here. Yahoo then sends your browser to your Redirect URI with
          <code>?code=…</code> on the end — the page will fail to load because
          nothing is listening there, which is expected. Copy the code out of
          the address bar and paste it below.</p>
        <button id="btnConnAuthUrl" class="btn ghost" type="button">Get authorization link</button>
        <div id="connAuthBox" hidden>
          <a id="connAuthUrl" target="_blank" rel="noreferrer" class="authlink"></a>
          <label>Paste the code from the address bar
            <input id="connCode" type="text" placeholder="code=… (everything after the =)">
          </label>
          <button id="btnConnExchange" class="btn primary" type="button">Connect</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>Draft schedule <span id="sCountdown" class="pill"></span></h3>
      <p class="hint">Store the date with its timezone so the countdown is never
        ambiguous. The board uses this to tell you when to be ready.</p>
      <div class="fields">
        <label>Draft date &amp; time <input id="sWhen" type="datetime-local"></label>
        <label>UTC offset
          <select id="sOffset">
            <option value="-04:00">EDT (UTC−4)</option>
            <option value="-05:00">EST / CDT (UTC−5)</option>
            <option value="-06:00">CST / MDT (UTC−6)</option>
            <option value="-07:00">MST / PDT (UTC−7)</option>
            <option value="-08:00">PST (UTC−8)</option>
            <option value="-09:00">AKDT (UTC−9)</option>
            <option value="-10:00">HST (UTC−10)</option>
            <option value="+00:00">UTC</option>
          </select>
        </label>
        <label>Timezone label <input id="sTzLabel" type="text" placeholder="EDT"></label>
        <label>Arrive early (minutes) <input id="sArrive" type="number" min="0" max="120"></label>
        <label>Where <input id="sWhere" type="text" placeholder="Online — Yahoo"></label>
        <label>Draft type
          <select id="sDraftType">
            <option value="snake">Snake</option>
            <option value="linear">Linear</option>
            <option value="auction">Auction</option>
          </select>
        </label>
        <label>Rounds <input id="sRounds" type="number" min="1" max="40"></label>
        <label>Seconds per pick <input id="sClock" type="number" min="10" max="600"></label>
      </div>
      <label style="margin-top:12px">Notes
        <input id="sNotes" type="text" placeholder="Anything else you need to remember">
      </label>
    </div>

    <div class="panel">
      <h3>Draft order</h3>
      <p class="hint">The order for round 1. Snake drafts reverse it every round.
        Leave untouched to use the team order below.</p>
      <div id="orderEditor" class="order"></div>
    </div>

    <div class="panel">
      <h3>Sync from your platform <span id="syncState" class="pill"></span></h3>
      <p class="hint">Only what your platform can actually provide is offered
        here — the buttons are built from the adapter's own declared
        capabilities, so a partial integration shows exactly what it can do
        rather than failing on a button that was never going to work.</p>
      <div id="syncButtons" class="sync-grid"></div>
      <div id="syncResult" class="sync-result" hidden></div>
    </div>

    <div class="panel">
      <h3>Projections</h3>
      <p class="hint">Drop in a CSV from any source. Column names are matched
        loosely, so most exports work as-is. Rows are re-scored with your rules.</p>
      <input id="csvFile" type="file" accept=".csv,text/csv">
      <div id="fileList" class="filelist"></div>
    </div>
    <div class="panel">
      <h3>Scoring</h3>
      <p class="hint">Points per unit. Blank or zero means the stat is ignored.</p>
      <div id="scoringEditor" class="scoring"></div>
    </div>
    <div class="panel">
      <h3>Scoring bonuses</h3>
      <p class="hint">Extra points at a yardage threshold. Multiple thresholds
        for the same stat stack — a 400-yard passing game earns both the 300
        and the 400 bonus, matching how Yahoo awards them.</p>
      <div id="bonusEditor" class="bands"></div>
      <button id="btnAddBonus" class="btn ghost" type="button">+ Add bonus</button>
    </div>

    <div class="panel">
      <h3>Points-allowed bands</h3>
      <p class="hint">Defense scoring by band rather than per point. Each row is
        an inclusive upper bound; the last row covers everything above it.</p>
      <div id="bandEditor" class="bands"></div>
    </div>

    <div class="panel">
      <h3>Roster slots</h3>
      <div id="rosterEditor" class="slots"></div>
    </div>

    <div class="panel">
      <h3>Waivers &amp; playoffs</h3>
      <div class="fields">
        <label>Waiver type
          <select id="wType">
            <option value="continual_rolling">Continual rolling list</option>
            <option value="faab">FAAB bidding</option>
            <option value="reverse_standings">Reverse standings</option>
          </select>
        </label>
        <label>Waiver days <input id="wDays" type="number" min="0" max="7"></label>
        <label>Processing <input id="wProcess" type="text" placeholder="Game Time - Tuesday"></label>
        <label>Playoff teams <input id="pTeams" type="number" min="0" max="16"></label>
        <label>Playoff weeks <input id="pWeeks" type="text" placeholder="15, 16, 17"></label>
        <label>Trade deadline (week)
          <input id="tDeadline" type="number" min="0" max="18">
        </label>
      </div>
    </div>
    <div class="panel">
      <h3>Trade rules</h3>
      <div id="tradeEditor" class="fields"></div>
    </div>
    <div class="panel">
      <h3>Teams</h3>
      <div id="teamEditor" class="team-rows"></div>
      <label class="inline">My team
        <select id="myTeam" class="sel"></select>
      </label>
    </div>
    <div id="saveProblems" class="problems" hidden></div>
    <button id="btnSave" class="btn primary big" type="button">Save league</button>
  </section>
</template>

<script src="/app.js"></script>
</body>
</html>
